services:
  sms-bridge-chat:
    build:
      context: .
    image: sms-bridge-chat:local
    container_name: sms-bridge-chat
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - ${APPDATA_PATH:-./data}:/data
      - ${CONFIG_PATH:-./config}:/config
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
